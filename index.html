<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinesh Mandal - Photo Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-100px) translateX(50px); }
            50% { transform: translateY(-200px) translateX(-50px); }
            75% { transform: translateY(-100px) translateX(100px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 700;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            font-weight: 300;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 20px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #764ba2;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -50%; }
            100% { left: 150%; }
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .frame-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .frame-option {
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            position: relative;
        }

        .frame-option:hover {
            transform: scale(1.05);
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .frame-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf5 100%);
        }

        .frame-preview {
            width: 100%;
            height: 150px;
            border: 10px solid;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            color: #999;
        }

        .frame-name {
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #333;
        }

        #photoCanvas {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin: 30px auto;
            display: none;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .upload-area {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <header>
            <h1>✨ Dinesh Mandal ✨</h1>
            <p class="tagline">अपनी फोटो को खूबसूरत फ्रेम में सजाएं</p>
        </header>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">अपनी फोटो अपलोड करें</div>
                    <div class="upload-subtext">या यहाँ क्लिक करें</div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">फ्रेम चुनें</h2>
            
            <div class="frame-gallery">
                <div class="frame-option selected" data-frame="classic">
                    <div class="frame-preview" style="border-color: #8B4513;">
                        Classic
                    </div>
                    <div class="frame-name">Classic Wood</div>
                </div>

                <div class="frame-option" data-frame="gold">
                    <div class="frame-preview" style="border-color: #FFD700;">
                        Gold
                    </div>
                    <div class="frame-name">Golden Luxury</div>
                </div>

                <div class="frame-option" data-frame="silver">
                    <div class="frame-preview" style="border-color: #C0C0C0;">
                        Silver
                    </div>
                    <div class="frame-name">Silver Elegance</div>
                </div>

                <div class="frame-option" data-frame="modern">
                    <div class="frame-preview" style="border-color: #000000;">
                        Modern
                    </div>
                    <div class="frame-name">Modern Black</div>
                </div>

                <div class="frame-option" data-frame="vintage">
                    <div class="frame-preview" style="border-color: #CD853F; border-style: double;">
                        Vintage
                    </div>
                    <div class="frame-name">Vintage Royal</div>
                </div>

                <div class="frame-option" data-frame="colorful">
                    <div class="frame-preview" style="border-color: #FF6B6B;">
                        Colorful
                    </div>
                    <div class="frame-name">Colorful Vibrant</div>
                </div>
            </div>

            <canvas id="photoCanvas"></canvas>

            <div class="controls" id="controls" style="display: none;">
                <button class="btn" onclick="downloadImage()">⬇️ डाउनलोड करें</button>
                <button class="btn" onclick="resetImage()">🔄 नई फोटो</button>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 Dinesh Mandal | Made with ❤️</p>
        </div>
    </div>

    <script>
        // Particles animation
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.width = Math.random() * 10 + 5 + 'px';
            particle.style.height = particle.style.width;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(particle);
        }

        let currentImage = null;
        let selectedFrame = 'classic';

        const frames = {
            classic: { color: '#8B4513', width: 30, style: 'solid' },
            gold: { color: '#FFD700', width: 35, style: 'solid' },
            silver: { color: '#C0C0C0', width: 30, style: 'solid' },
            modern: { color: '#000000', width: 25, style: 'solid' },
            vintage: { color: '#CD853F', width: 40, style: 'double' },
            colorful: { color: '#FF6B6B', width: 30, style: 'solid' }
        };

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImage = new Image();
                    currentImage.onload = function() {
                        applyFrame();
                    };
                    currentImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.querySelectorAll('.frame-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.frame-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedFrame = this.dataset.frame;
                if (currentImage) {
                    applyFrame();
                }
            });
        });

        function applyFrame() {
            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');
            const frame = frames[selectedFrame];

            const maxWidth = 800;
            const maxHeight = 600;
            let width = currentImage.width;
            let height = currentImage.height;

            if (width > maxWidth) {
                height = (maxWidth / width) * height;
                width = maxWidth;
            }
            if (height > maxHeight) {
                width = (maxHeight / height) * width;
                height = maxHeight;
            }

            const frameWidth = frame.width;
            canvas.width = width + (frameWidth * 2);
            canvas.height = height + (frameWidth * 2);

            // Draw frame
            ctx.fillStyle = frame.color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (frame.style === 'double') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(frameWidth / 3, frameWidth / 3, canvas.width - (frameWidth * 2 / 3), canvas.height - (frameWidth * 2 / 3));
                ctx.fillStyle = frame.color;
                ctx.fillRect(frameWidth / 2, frameWidth / 2, canvas.width - frameWidth, canvas.height - frameWidth);
            }

            // Add shadow effect
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;

            // Draw image
            ctx.drawImage(currentImage, frameWidth, frameWidth, width, height);

            canvas.style.display = 'block';
            document.getElementById('controls').style.display = 'block';
        }

        function downloadImage() {
            const canvas = document.getElementById('photoCanvas');
            const link = document.createElement('a');
            link.download = 'dinesh-mandal-framed-photo.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function resetImage() {
            currentImage = null;
            document.getElementById('photoCanvas').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
</html>
